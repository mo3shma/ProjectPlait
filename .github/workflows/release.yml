# Builds, tests and publishes a release whenever main has a version that isn't released yet.
# To release: raise versionCode and versionName in app/build.gradle.kts, add a "## <version>: ..." section to
# CHANGELOG.md, and push to main. The release is tagged v<version> and carries plait.apk (64-bit phones) and
# plait-armv7.apk (32-bit phones). The app's own updater reads this release.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      # The certificate every Plait release is signed with. A build signed with anything else is not published,
      # because phones would refuse to install it over the version they have.
      EXPECTED_SHA1: "77:EC:81:98:56:2D:3C:F1:81:44:EC:17:45:7B:31:B6:07:2E:52:BC"
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$v is already released. Nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$v."
          fi

      - name: Unpack the signing key
        id: key
        if: steps.version.outputs.new == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Not set up yet: skip quietly rather than fail every push.
            echo "::notice::No PLAIT_KEYSTORE_BASE64 secret, so nothing is released. Add the signing secrets to turn releases on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plait.keystore"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3
        if: steps.key.outputs.ready == 'true'

      - name: Test and build
        if: steps.key.outputs.ready == 'true'
        env:
          PLAIT_KEYSTORE: ${{ runner.temp }}/plait.keystore
          PLAIT_STORE_PASSWORD: ${{ secrets.PLAIT_STORE_PASSWORD }}
          PLAIT_KEY_ALIAS: ${{ secrets.PLAIT_KEY_ALIAS }}
          PLAIT_KEY_PASSWORD: ${{ secrets.PLAIT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Check the signature
        if: steps.key.outputs.ready == 'true'
        run: |
          # plait.apk is for 64-bit phones (nearly all), plait-armv7.apk for older 32-bit ones.
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk plait.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk plait-armv7.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for apk in plait.apk plait-armv7.apk; do
            sha1=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-1 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
            echo "$apk is signed with $sha1"
            if [ "$sha1" != "$EXPECTED_SHA1" ]; then
              echo "::error::$apk is signed with $sha1, not the Plait key $EXPECTED_SHA1. Check the signing secrets."
              exit 1
            fi
          done

      - name: Publish the release
        if: steps.key.outputs.ready == 'true'
        run: |
          v="${{ steps.version.outputs.version }}"
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="$v" '$0 ~ "^## "v":" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Android 8 or newer. Download plait.apk below and open it on your phone." > notes.md; fi
          title=$(sed -n "s/^## $v: //p" CHANGELOG.md | head -1)
          gh release create "v$v" plait.apk plait-armv7.apk --target "$GITHUB_SHA" --title "Plait $v${title:+: $title}" --notes-file notes.md --latest
